---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  fix:
    uses: suzuki-shunsuke/js-autofix-action/.github/workflows/autofix-ci.yaml@71bff57547985a27ed4aaff4e7c2b3d6798704a0 # v0.0.3
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.64.0
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
  autofix:
    # Required status check of this workflow
    runs-on: ubuntu-26.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - fix
    steps:
      - run: exit 1
