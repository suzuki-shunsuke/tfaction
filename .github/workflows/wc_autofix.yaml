---
name: autofix (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  jsmodule:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{github.event.pull_request.head.sha}}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - run: npm ci

      # Archive node_modules with tar to keep file permissions and symlinks (e.g. node_modules/.bin)
      - run: tar -cf node_modules.tar node_modules
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: node_modules.tar
          name: node_modules
          retention-days: 1

  autofix:
    runs-on: ubuntu-26.04
    needs: jsmodule
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{github.event.pull_request.head.sha}}
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8.0.2
        with:
          name: node_modules
          path: ${{runner.temp}}
      - run: tar -xf "$RUNNER_TEMP/node_modules.tar"

      - run: aqua upc -prune
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: aqua upc -prune
        working-directory: install
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: npm run fmt

      - uses: autofix-ci/action@v1.3.4
