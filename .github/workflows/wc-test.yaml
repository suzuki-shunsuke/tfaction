---
name: wc-test
on:
  workflow_call:
    inputs:
      sha:
        description: The commit SHA where the action was built
        required: true
        type: string
    secrets:
      gh_app_id:
        required: true
      gh_app_private_key:
        required: true

jobs:
  test-normal:
    name: Test Normal (${{matrix.env.key}})
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        env:
          - key: terraform
            TFACTION_CONFIG: tests/tfaction-root.yaml
            TFACTION_WORKING_DIR: tests/foo
          - key: opentofu
            TFACTION_WORKING_DIR: tests/opentofu/bar
            TFACTION_CONFIG: tests/opentofu/tfaction-root.yaml
          - key: terragrunt
            TFACTION_CONFIG: tests/terragrunt/tfaction-root.yaml
            TFACTION_WORKING_DIR: tests/terragrunt/zoo
    env:
      TFACTION_CONFIG: ${{matrix.env.TFACTION_CONFIG}}
      TFACTION_WORKING_DIR: ${{matrix.env.TFACTION_WORKING_DIR}}
      TFACTION_JOB_TYPE: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: dist
      - name: Replace suzuki-shusnuke/tfaction/*@main with ./*
        run: |
          git ls-files | grep -v ".github" | xargs sed -i -E 's|uses: suzuki-shunsuke/tfaction@main|uses: ./|'
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{secrets.gh_app_id}}
          private-key: ${{secrets.gh_app_private_key}}
          permission-pull-requests: write
          permission-contents: write

      - name: Test setup
        uses: ./
        with:
          action: setup
          github_token: ${{steps.token.outputs.token}}
        id: setup
        if: |
          ! github.event.pull_request.head.repo.fork

      - name: Test terraform init
        uses: ./
        with:
          action: terraform-init
          github_token: ${{steps.token.outputs.token}}
        if: |
          ! github.event.pull_request.head.repo.fork

      - name: Test test
        uses: ./
        with:
          action: test
          github_token: ${{steps.token.outputs.token}}
        id: test
        if: |
          ! github.event.pull_request.head.repo.fork

      - name: Test plan
        uses: ./
        id: plan
        with:
          action: plan
          github_token: ${{steps.token.outputs.token}}
        if: |
          ! github.event.pull_request.head.repo.fork

  test-change-checkout-path:
    name: Change checkout path (${{matrix.env.key}})
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        env:
          - key: terraform
            TFACTION_CONFIG: yoo/tests/tfaction-root.yaml
            TFACTION_WORKING_DIR: tests/foo-2
          - key: opentofu
            TFACTION_CONFIG: yoo/tests/opentofu/tfaction-root.yaml
            TFACTION_WORKING_DIR: tests/opentofu/bar-2
          - key: terragrunt
            TFACTION_CONFIG: yoo/tests/terragrunt/tfaction-root.yaml
            TFACTION_WORKING_DIR: tests/terragrunt/zoo-2
    env:
      TFACTION_CONFIG: ${{matrix.env.TFACTION_CONFIG}}
      TFACTION_WORKING_DIR: ${{matrix.env.TFACTION_WORKING_DIR}}
      TFACTION_JOB_TYPE: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
          path: yoo
      # The action built by the release job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: yoo/dist
          name: dist
      - name: Replace suzuki-shusnuke/tfaction/*@main with ./*
        working-directory: yoo
        run: |
          git ls-files | grep -v ".github" | xargs sed -i -E 's|uses: suzuki-shunsuke/tfaction@main|uses: ./|'
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{secrets.gh_app_id}}
          private-key: ${{secrets.gh_app_private_key}}
          permission-pull-requests: write
          permission-contents: write

      - name: Test setup
        uses: ./yoo
        with:
          action: setup
          github_token: ${{steps.token.outputs.token}}
        id: setup
        if: |
          ! github.event.pull_request.head.repo.fork

      - name: Test terraform init
        uses: ./yoo
        with:
          action: terraform-init
          github_token: ${{steps.token.outputs.token}}
        if: |
          ! github.event.pull_request.head.repo.fork

      - name: Test test
        uses: ./yoo
        with:
          action: test
          github_token: ${{steps.token.outputs.token}}
        id: test
        if: |
          ! github.event.pull_request.head.repo.fork

      - name: Test plan
        uses: ./yoo
        id: plan
        with:
          action: plan
          github_token: ${{steps.token.outputs.token}}
        if: |
          ! github.event.pull_request.head.repo.fork

  test-sub:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      TFACTION_CONFIG: tests/tfaction-root.yaml
      TFACTION_WORKING_DIR: tests/foo
      TFACTION_JOB_TYPE: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: dist
      - name: Replace suzuki-shusnuke/tfaction/*@main with ./*
        run: |
          git ls-files | grep -v ".github" | xargs sed -i -E 's|uses: suzuki-shunsuke/tfaction@main|uses: ./|'
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{secrets.gh_app_id}}
          private-key: ${{secrets.gh_app_private_key}}
          permission-pull-requests: write
          permission-contents: write

      - name: Hide comment
        uses: ./
        if: |
          github.event.pull_request &&
          ! github.event.pull_request.head.repo.fork
        with:
          action: hide-comment

      - name: Test test (module)
        uses: ./
        with:
          action: test
          github_token: ${{steps.token.outputs.token}}
        if: |
          ! github.event.pull_request.head.repo.fork
        env:
          TFACTION_WORKING_DIR: tests/modules/foo
          TFACTION_TARGET: tests/modules/foo

      - name: Test scaffold-working-dir
        uses: ./
        with:
          action: scaffold-working-dir
        env:
          TFACTION_WORKING_DIR: tests/zoo

      - name: Test get-target-config
        uses: ./
        id: target-config
        with:
          action: get-target-config
        env:
          TFACTION_CONFIG: tests/tfaction-root.yaml
          TFACTION_JOB_TYPE: terraform
          TFACTION_WORKING_DIR: tests/aws/foo/dev

      - name: Test actions' outputs
        uses: ./
        with:
          action: test-action
        env:
          TFACTION_TEST_ACTION: "true"
          TARGET_CONFIG: ${{ toJSON(steps.target-config.outputs) }}

  test-drift-detection:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions: {}
    env:
      TFACTION_CONFIG: tests/tfaction-root.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: dist
      - name: Replace suzuki-shusnuke/tfaction/*@main with ./*
        run: |
          git ls-files | grep -v ".github" | xargs sed -i -E 's|uses: suzuki-shunsuke/tfaction@main|uses: ./|'
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{secrets.gh_app_id}}
          private-key: ${{secrets.gh_app_private_key}}
          permission-pull-requests: write
          permission-contents: write
          permission-issues: write
          repositories: test-tfaction

      - name: Create a dummy working directory
        run: mkdir -p "tests/aws/foo/dev-${GITHUB_RUN_ID}"
      - name: Create a dummy tfaction.yaml
        run: echo '{}' > "tests/aws/foo/dev-${GITHUB_RUN_ID}/tfaction.yaml"
      - run: git add "tests/aws/foo/dev-${GITHUB_RUN_ID}"
      - name: Test get-or-create-drift-issue
        uses: ./
        id: get-or-create-drift-issue
        with:
          github_token: ${{steps.token.outputs.token}}
          action: get-or-create-drift-issue
        env:
          TFACTION_TARGET: tests/aws/foo/dev-${{github.run_id}}
      - run: git reset HEAD "tests/aws/foo/dev-${GITHUB_RUN_ID}"
      - name: Remove a dummy working directory
        run: rm -R "tests/aws/foo/dev-${GITHUB_RUN_ID}"
      - run: sleep 5
      - name: Test create-drift-issues
        uses: ./
        id: create-drift-issues
        with:
          github_token: ${{steps.token.outputs.token}}
          action: create-drift-issues

      - name: Test env
        run: |
          if [ -z "$TFACTION_DRIFT_ISSUE_NUMBER" ]; then
            echo "::error:: TFACTION_DRIFT_ISSUE_NUMBER is not set" >&2
            exit 1
          fi
          if [ "${TFACTION_DRIFT_ISSUE_STATE,,}" != "open" ]; then
            echo "::error:: TFACTION_DRIFT_ISSUE_STATE is not expected" >&2
            exit 1
          fi

  test-list-targets:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions: {}
    env:
      TFACTION_CONFIG: tests/tfaction-root.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: dist
      - name: Replace suzuki-shusnuke/tfaction/*@main with ./*
        run: |
          git ls-files | grep -v ".github" | xargs sed -i -E 's|uses: suzuki-shunsuke/tfaction@main|uses: ./|'
      - name: Test list-targets
        uses: ./
        with:
          action: list-targets
