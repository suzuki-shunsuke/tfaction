---
name: wc-test
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  jsmodule:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - run: npm ci

      # Archive node_modules with tar to keep file permissions and symlinks (e.g. node_modules/.bin)
      - run: tar -cf "$RUNNER_TEMP/node_modules.tar" node_modules
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{runner.temp}}/node_modules.tar
          name: node_modules-test
          retention-days: 1

  test:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    needs: [jsmodule]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node_modules-test
          path: ${{runner.temp}}
      - run: tar -xf "$RUNNER_TEMP/node_modules.tar"
      - run: npm t
      - run: npx eslint
