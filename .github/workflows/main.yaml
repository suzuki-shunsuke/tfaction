name: Update the latest branch
on:
  push:
    branches:
      - main
jobs:
  release:
    uses: suzuki-shunsuke/js-action-release-workflow/.github/workflows/release.yaml@16e5ae83421dd948ccc5171777361ee8a389d550 # v0.0.3
    with:
      version: latest
      # Build the action and generate JSON Schema, which is committed with files
      build_command: npm run build && mkdir -p schema && TFACTION_GENERATE_JSON_SCHEMA=1 node dist/index.js
      files: |
        schema/tfaction.json
        schema/tfaction-root.json
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
