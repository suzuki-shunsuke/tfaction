name: test (workflow_call)
on:
  workflow_call:
    secrets:
      gh_app_id:
        required: false
      gh_app_private_key:
        required: false
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  path-filter:
    # Get changed files to filter jobs
    timeout-minutes: 10
    outputs:
      build-schema: ${{steps.changes.outputs.build-schema}}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            build-schema:
              - .github/workflows/test.yaml
              - .github/workflows/workflow_call_test.yaml
              - .github/workflows/wc-deploy-schema.yaml
              - "schema/**"

  test:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.66.0
    permissions:
      pull-requests: read
      contents: read

  build-schema:
    needs: path-filter
    if: needs.path-filter.outputs.build-schema == 'true'
    uses: ./.github/workflows/wc-deploy-schema.yaml
    permissions:
      contents: write

  js:
    uses: suzuki-shunsuke/js-action-test-workflow/.github/workflows/test.yaml@c834a7dfc9560fb54167eaf33f94eb28f1a4e222 # v0.0.4
    permissions:
      contents: read
      id-token: write
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  create-pr-branch:
    uses: ./.github/workflows/wc-create-pr-branch.yaml
    if: |
      ! (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    with:
      pr: ${{github.event.pull_request.number}}
    secrets:
      gh_app_id: ${{secrets.gh_app_id}}
      gh_app_private_key: ${{secrets.gh_app_private_key}}
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  test-doc:
    uses: suzuki-shunsuke/release-doc-action/.github/workflows/test.yaml@1cb15eb99aa8f0ae05ae28174430e49579e878fa # v0.2.0
    with:
      # Build the document only if these files are changed
      paths: |
        website/**
        skills/tfaction/references/**
        .github/workflows/test.yaml
        .github/workflows/workflow_call_test.yaml
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      pull-requests: read
      contents: read
      id-token: write
