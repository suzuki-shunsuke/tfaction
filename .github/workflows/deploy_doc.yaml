---
name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - website/**
      - skills/tfaction/references/**
      - .github/workflows/deploy_doc.yaml
permissions: {}
jobs:
  deploy-doc:
    uses: suzuki-shunsuke/release-doc-action/.github/workflows/release.yaml@1cb15eb99aa8f0ae05ae28174430e49579e878fa # v0.2.0
    with:
      issue_number: "2533"
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      issues: write
      id-token: write
