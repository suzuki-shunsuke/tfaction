---
name: wc-release
run-name: wc-release (${{inputs.pr}})
on:
  workflow_call:
    inputs:
      version:
        description: "Version"
        required: true
        type: string
      pr:
        description: "Pull Request Number"
        required: false
        type: string
      is_comment:
        description: If the comment is posted
        required: false
        default: false
        type: boolean
      artifact_suffix:
        description: |
          A suffix of artifact names.
          Artifact names must be unique in a workflow run, so set this when this workflow is called multiple times in a workflow run.
        required: false
        default: ""
        type: string
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true

jobs:
  jsmodule:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh pr checkout "$PR"
        if: inputs.pr != ''
        env:
          GITHUB_TOKEN: ${{github.token}}
          PR: ${{inputs.pr}}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - run: npm ci

      # Archive node_modules with tar to keep file permissions and symlinks (e.g. node_modules/.bin)
      - run: tar -cf node_modules.tar node_modules
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: node_modules.tar
          name: node_modules-release${{inputs.artifact_suffix}}
          retention-days: 1

  release:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    needs: [jsmodule]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh pr checkout "$PR"
        if: inputs.pr != ''
        env:
          GITHUB_TOKEN: ${{github.token}}
          PR: ${{inputs.pr}}

      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.65.1
        env:
          GITHUB_TOKEN: ${{github.token}}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node_modules-release${{inputs.artifact_suffix}}
          path: ${{runner.temp}}
      - run: tar -xf "$RUNNER_TEMP/node_modules.tar"

      - run: cmdx -v
        env:
          GITHUB_TOKEN: ${{github.token}}

      - run: cmdx build

      - uses: suzuki-shunsuke/release-js-action@ff106e3a3f5b34f174a23db3110031fbf463f15c # v0.2.1
        with:
          version: ${{inputs.version}}
          is_comment: ${{inputs.is_comment}}
          files: |
            schema/tfaction.json
            schema/tfaction-root.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist
          name: js${{inputs.artifact_suffix}}
