---
name: wc-release
run-name: wc-release (${{inputs.pr}})
on:
  workflow_call:
    inputs:
      version:
        description: "Version"
        required: true
        type: string
      pr:
        description: "Pull Request Number"
        required: false
        type: string
      is_comment:
        description: If the comment is posted
        required: false
        default: false
        type: boolean
      artifact_suffix:
        description: |
          A suffix of artifact names.
          Artifact names must be unique in a workflow run, so set this when this workflow is called multiple times in a workflow run.
        required: false
        default: ""
        type: string
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true

jobs:
  # Install npm packages through Takumi Guard in a job with id-token: write,
  # build the action in a job with only contents: read,
  # and push the release branch in a job with contents: write, which doesn't run code of the repository and its dependencies.
  # The built dist is uploaded as the artifact dist${{inputs.artifact_suffix}}.
  release:
    uses: suzuki-shunsuke/js-action-release-workflow/.github/workflows/release.yaml@926d8ac583b51179ff3f5532992cd545292bdab0 # v0.0.7
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      version: ${{inputs.version}}
      pr: ${{inputs.pr}}
      is_comment: ${{inputs.is_comment}}
      artifact_suffix: ${{inputs.artifact_suffix}}
      # The same as `cmdx build` except npm ci, because npm packages are restored from the artifact.
      build_command: |
        npm run build
        mkdir -p schema
        TFACTION_GENERATE_JSON_SCHEMA=1 node dist/index.js
        npm run fmt
      files: |
        schema/tfaction.json
        schema/tfaction-root.json
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
